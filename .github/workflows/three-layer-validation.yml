name: Three-Layer Validation

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  AIRFLOW_VERSION: "2.6.2"
  PYTHON_VERSION: "3.9"

jobs:
  # ---------------------------------------------------------------
  # Layer 1 — Syntax check (compileall)
  # Fastest check, runs first. No pip installs needed beyond Python.
  # Catches: SyntaxError, IndentationError, invalid tokens.
  # ---------------------------------------------------------------
  layer1-syntax-check:
    name: "Layer 1: Syntax Check (compileall)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Compile-check all Python files
        run: python -m compileall -q .

  # ---------------------------------------------------------------
  # Layer 2 — Static import check (pylint E0401)
  # Catches: misspelled file/module imports, missing packages,
  # missing __init__.py, broken relative imports.
  # Does NOT execute code — purely static analysis.
  # ---------------------------------------------------------------
  layer2-import-check:
    name: "Layer 2: Import Check (pylint E0401)"
    needs: layer1-syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-airflow-${{ env.AIRFLOW_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-airflow-${{ env.AIRFLOW_VERSION }}-

      - name: Install Airflow with official constraints
        run: |
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"

      - name: Install project requirements
        run: |
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt --constraint "${CONSTRAINT_URL}"
          fi

      - name: Install pylint
        run: pip install pylint

      - name: Run pylint import check (E0401) on all Python files
        run: |
          # Collect all .py files tracked by git (respects .gitignore)
          PY_FILES=$(git ls-files '*.py')

          if [ -z "$PY_FILES" ]; then
            echo "No Python files found."
            exit 0
          fi

          echo "Checking $(echo "$PY_FILES" | wc -l | tr -d ' ') Python file(s) for broken imports..."
          echo ""

          # Run pylint: disable everything except E0401 (import-error)
          pylint --disable=all --enable=E0401 --score=no $PY_FILES

  # ---------------------------------------------------------------
  # Layer 3 — Airflow DAG validation (DagBag)
  # Catches: ImportError, ModuleNotFoundError, invalid DAG config,
  # broken operators, circular imports at DAG load time.
  # This EXECUTES code (imports modules), catching runtime errors
  # that static tools cannot detect.
  # ---------------------------------------------------------------
  layer3-dag-validation:
    name: "Layer 3: Airflow DAG Validation (DagBag)"
    needs: layer2-import-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-airflow-${{ env.AIRFLOW_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-airflow-${{ env.AIRFLOW_VERSION }}-

      - name: Install Airflow with official constraints
        run: |
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"

      - name: Install project requirements
        run: |
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt --constraint "${CONSTRAINT_URL}"
          fi

      - name: Set AIRFLOW_HOME (isolated CI-only SQLite DB)
        run: echo "AIRFLOW_HOME=/home/runner/airflow_home_ci" >> $GITHUB_ENV

      - name: Initialize Airflow metadata DB
        run: airflow db init

      - name: Validate all Airflow DAGs across repo
        run: python scripts/validate_entire_repo_dags.py
